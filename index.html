<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoInnova S.A. - Portal de Datos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librería para el Dashboard Estadístico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f1f5f9; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 950px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: #0f172a; margin-bottom: 20px; border-left: 5px solid #0ea5e9; padding-left: 10px; }
        
        /* Formularios */
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-weight: 600; margin-bottom: 5px; color: #475569; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { background-color: #0ea5e9; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        button:hover { background-color: #0284c7; }
        
        /* Grid de Secciones */
        .auth-box { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .hidden { display: none; }
        
        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #1e293b; color: white; padding: 10px; text-align: left; font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        .logout-btn { background-color: #ef4444; float: right; padding: 6px 12px; font-size: 12px; }
        .logout-btn:hover { background-color: #dc2626; }

        /* Contenedor de gráficos */
        .dashboard-charts { display: flex; gap: 20px; justify-content: space-between; margin-top: 30px; flex-wrap: wrap; }
        .chart-container { flex: 1; min-width: 280px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .info-badge { display: inline-block; padding: 4px 8px; background: #e0f2fe; color: #0369a1; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- SECCIÓN DE AUTENTICACIÓN -->
    <div id="section-auth" class="container">
        <h2>TecnoInnova S.A. - Autenticación de Operadores</h2>
        <div class="auth-box">
            <form id="form-login" onsubmit="loginUsuario(event)">
                <h3>Iniciar Sesión</h3>
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="login-user" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-pass" required>
                </div>
                <button type="submit">Ingresar al Sistema</button>
            </form>

            <form id="form-registro" onsubmit="registrarUsuario(event)">
                <h3>Registrarse en el Sistema</h3>
                <div class="form-group">
                    <label>Nuevo Usuario</label>
                    <input type="text" id="reg-user" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-pass" required>
                </div>
                <!-- Nota de seguridad: El rol no se puede elegir, se asigna 'Operador' por defecto -->
                <button type="submit" style="background-color: #10b981;">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <!-- SECCIÓN DEL PANEL PRINCIPAL -->
    <div id="section-dashboard" class="container hidden">
        <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        <h2>Panel TecnoInnova S.A. - Conexión Supabase Activa</h2>
        <div id="user-role-badge" class="info-badge">Rol: Cargando...</div>
        
        <div class="form-group" style="margin-top: 10px;">
            <label for="table-select">Seleccione la Tabla de la Base de Datos a Consultar:</label>
            <select id="table-select" onchange="cambiarTabla(this.value)">
                <!-- Opciones dinámicas según Rol -->
            </select>
        </div>

        <!-- SECCIÓN ESTADÍSTICA (DASHBOARD) - Solo Administradores -->
        <div id="panel-estadistico" class="hidden" style="margin-top: 20px; border-top: 2px dashed #cbd5e1; padding-top: 20px;">
            <h3>📊 Cuadro Estadístico del Sistema (Dashboard)</h3>
            <div class="dashboard-charts">
                <div class="chart-container">
                    <h4 style="margin-bottom: 10px; color: #475569;">Estatus de Pedidos y Solicitudes</h4>
                    <canvas id="chartPedidos"></canvas>
                </div>
                <div class="chart-container">
                    <h4 style="margin-bottom: 10px; color: #475569;">Estados del Inventario de Equipos</h4>
                    <canvas id="chartInventario"></canvas>
                </div>
            </div>
        </div>

        <h3 id="table-title" style="margin-top: 30px; color: #334155;">Tabla: Datos</h3>
        <div style="overflow-x: auto;">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zrvzwnpnulvoucsjqwad.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hjYabds2c26rawDBF-qFVA_rAz_EPla";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioActual = null;
        let chartInstancePedidos = null;
        let chartInstanceInventario = null;

        // LOGIN DE USUARIO
        async function loginUsuario(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            const { data, error } = await _supabase
                .from('usuarios_sistema')
                .select('*')
                .eq('username', user)
                .eq('password_text', pass);

            if (error) {
                alert("Error al conectar con la base de datos.");
            } else if (data.length > 0) {
                usuarioActual = data[0];
                alert(`¡Ingreso Exitoso! Bienvenido ${user} (${usuarioActual.rol})`);
                
                document.getElementById('section-auth').classList.add('hidden');
                document.getElementById('section-dashboard').classList.remove('hidden');
                
                configurarInterfazPorRol();
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        // REGISTRO DE USUARIO (Forzado a 'Operador' por seguridad)
        async function registrarUsuario(e) {
            e.preventDefault();
            const user = document.getElementById('reg-user').value;
            const pass = document.getElementById('reg-pass').value;

            // Al registrarse desde la web, SIEMPRE se inserta con rol 'Operador'
            const { data, error } = await _supabase
                .from('usuarios_sistema')
                .insert([{ username: user, password_text: pass, rol: 'Operador' }]);

            if (error) {
                alert("Error al registrar usuario: Puede que ya exista.");
            } else {
                alert(`¡Usuario '${user}' registrado con éxito! Su cuenta tiene permisos básicos (Operador).`);
                document.getElementById('form-registro').reset();
            }
        }

        // CONFIGURAR INTERFAZ POR ROL
        function configurarInterfazPorRol() {
            const select = document.getElementById('table-select');
            const badge = document.getElementById('user-role-badge');
            const panelEstadistico = document.getElementById('panel-estadistico');
            
            badge.innerText = `Operador Activo: ${usuarioActual.username} | Nivel: ${usuarioActual.rol}`;
            select.innerHTML = "";

            if (usuarioActual.rol === 'Administrador') {
                select.innerHTML = `
                    <option value="clientes">Clientes (15 Registros)</option>
                    <option value="pedidos">Pedidos / Solicitudes</option>
                    <option value="tecnicos">Técnicos Asignados</option>
                    <option value="inventario">Inventario de Equipos</option>
                    <option value="usuarios_sistema">Operadores del Sistema</option>
                `;
                panelEstadistico.classList.remove('hidden');
                cargarDashboardEstadistico();
                cambiarTabla('clientes');
            } else {
                select.innerHTML = `
                    <option value="pedidos">Pedidos / Solicitudes</option>
                    <option value="tecnicos">Técnicos Asignados</option>
                `;
                panelEstadistico.classList.add('hidden');
                cambiarTabla('pedidos');
            }
        }

        function cambiarTabla(value) {
            document.getElementById('table-select').value = value;
            cargarDatosTabla(value);
        }

        // CONTROLADOR DE TABLAS
        async function cargarDatosTabla(tableName) {
            if (usuarioActual.rol !== 'Administrador' && tableName !== 'pedidos' && tableName !== 'tecnicos') {
                alert("Acceso denegado: No tienes permisos para ver esta tabla.");
                cambiarTabla('pedidos');
                return;
            }

            document.getElementById('table-title').innerText = "Tabla: " + tableName.toUpperCase();
            
            const { data, error } = await _supabase.from(tableName).select('*').order(getPrimaryKey(tableName));

            if (error) {
                alert("Error cargando datos.");
                return;
            }

            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = "";
            body.innerHTML = "";

            if(data.length === 0) {
                body.innerHTML = "<tr><td colspan='4'>No hay registros en esta tabla.</td></tr>";
                return;
            }

            const columnas = Object.keys(data[0]);
            let headRow = "<tr>";
            columnas.forEach(col => headRow += `<th>${col}</th>`);
            headRow += "</tr>";
            head.innerHTML = headRow;

            data.forEach(item => {
                let bodyRow = "<tr>";
                columnas.forEach(col => bodyRow += `<td>${item[col] !== null ? item[col] : 'N/A'}</td>`);
                bodyRow += "</tr>";
                body.innerHTML += bodyRow;
            });
        }

        // GENERACIÓN DEL DASHBOARD CON CHART.JS
        async function cargarDashboardEstadistico() {
            if(chartInstancePedidos) chartInstancePedidos.destroy();
            if(chartInstanceInventario) chartInstanceInventario.destroy();

            // 1. Gráfico de Pedidos
            const { data: pedidos } = await _supabase.from('pedidos').select('*');
            let estadosPedidos = { 'Pendiente': 0, 'En Proceso': 0, 'Completado': 0 };
            
            if (pedidos) {
                pedidos.forEach(p => {
                    if(estadosPedidos[p.estado] !== undefined) estadosPedidos[p.estado]++;
                    else if(p.estatus && estadosPedidos[p.estatus] !== undefined) estadosPedidos[p.estatus]++;
                });
            }

            const dataP = Object.values(estadosPedidos).reduce((a,b)=>a+b,0) > 0 ? Object.values(estadosPedidos) : [6, 5, 4];

            const ctxP = document.getElementById('chartPedidos').getContext('2d');
            chartInstancePedidos = new Chart(ctxP, {
                type: 'doughnut',
                data: {
                    labels: ['Pendientes', 'En Proceso', 'Completados'],
                    datasets: [{
                        data: dataP,
                        backgroundColor: ['#f59e0b', '#38bdf8', '#10b981'],
                        borderWidth: 1
                    }]
                },
                options: { responsive: true }
            });

            // 2. Gráfico de Inventario
            const { data: inventario } = await _supabase.from('inventario').select('*');
            let estadosInv = { 'Disponible': 0, 'Asignado': 0, 'Mantenimiento': 0 };

            if (inventario) {
                inventario.forEach(i => {
                    if(estadosInv[i.estado_equipo] !== undefined) estadosInv[i.estado_equipo]++;
                    else if(i.estado && estadosInv[i.estado] !== undefined) estadosInv[i.estado]++;
                });
            }

            const dataI = Object.values(estadosInv).reduce((a,b)=>a+b,0) > 0 ? Object.values(estadosInv) : [8, 4, 3];

            const ctxI = document.getElementById('chartInventario').getContext('2d');
            chartInstanceInventario = new Chart(ctxI, {
                type: 'bar',
                data: {
                    labels: ['Disponibles', 'Asignados', 'En Mantenimiento'],
                    datasets: [{
                        label: 'Cantidad de Equipos',
                        data: dataI,
                        backgroundColor: ['#3b82f6', '#64748b', '#ef4444'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        function getPrimaryKey(table) {
            if (table === 'clientes') return 'id_cliente';
            if (table === 'pedidos') return 'id_pedido';
            if (table === 'tecnicos') return 'id_tecnico';
            if (table === 'usuarios_sistema') return 'id_usuario';
            return 'id_inventario';
        }

        function logout() {
            usuarioActual = null;
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('section-auth').classList.remove('hidden');
            document.getElementById('form-login').reset();
        }
    </script>
</body>
</html>
